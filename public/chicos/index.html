<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IA para chicos — aprendé cómo piensan las máquinas</title>
<style>
  :root { --fondo: #fff8ec; --texto: #2b2340; --tarjeta: #ffffff; --acento: #ff7a59; --bien: #1f9d55; --mal: #d64545; --suave: #6b6280; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 18px/1.6 system-ui, "Segoe UI", sans-serif; background: var(--fondo); color: var(--texto); }
  header { background: linear-gradient(135deg, #7b5cff, #ff7a59); color: #fff; padding: 1.5rem 1rem; text-align: center; }
  header h1 { margin: 0; font-size: 1.8rem; }
  header p { margin: .3rem 0 0; }
  header a { color: #fff; }
  main { max-width: 760px; margin: 0 auto; padding: 1rem; }
  .estrellas { font-size: 1.2rem; text-align: center; margin: .5rem 0 1rem; }
  .misiones { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: .8rem; }
  .mision { background: var(--tarjeta); border: 3px solid #eadfff; border-radius: 18px; padding: 1rem; cursor: pointer; text-align: left; font: inherit; color: inherit; }
  .mision:hover, .mision:focus-visible { border-color: #7b5cff; }
  .mision .emoji { font-size: 2.2rem; display: block; }
  .mision small { color: var(--suave); }
  article { background: var(--tarjeta); border-radius: 18px; padding: 1.2rem 1.4rem; margin-top: 1rem; }
  .pregunta { margin: 1.2rem 0; }
  .pregunta button { display: block; width: 100%; text-align: left; margin: .35rem 0; padding: .6rem .8rem; border-radius: 12px; border: 2px solid #eadfff; background: #fbf9ff; font: inherit; color: inherit; cursor: pointer; }
  .pregunta button.bien { border-color: var(--bien); background: #e7f7ee; }
  .pregunta button.mal { border-color: var(--mal); background: #fdecec; }
  .pista { color: var(--suave); font-size: .95rem; }
  .boton { display: inline-block; background: var(--acento); color: #fff; border: 0; border-radius: 999px; padding: .6rem 1.2rem; font: inherit; cursor: pointer; text-decoration: none; margin-top: .5rem; }
  .ojo { background: #fff3c4; border-radius: 12px; padding: .6rem .9rem; }
  footer { text-align: center; color: var(--suave); font-size: .9rem; padding: 2rem 1rem; }
</style>
</head>
<body>
<header>
  <h1>🤖 IA para chicos</h1>
  <p>Misiones cortas para entender la inteligencia artificial (de 10 a 13 años)</p>
</header>
<main id="app"></main>
<footer>Para mamás, papás y docentes: cada misión dura unos 10 minutos y termina con preguntas. El progreso queda guardado solo en este navegador.<br><a href="../">Ir al curso completo de AI Engineering</a></footer>
<script>
const MISIONES = [
  {
    emoji: '🧠', titulo: '¿Qué es la inteligencia artificial?',
    texto: `<p>La <strong>inteligencia artificial (IA)</strong> son programas de computadora que hacen cosas que antes solo podían hacer las personas: reconocer una cara en una foto, entender lo que decís, traducir un idioma o recomendarte un video.</p>
<p>Ya la usás todos los días aunque no te des cuenta:</p>
<ul><li>El celular que se desbloquea al ver tu cara.</li><li>La app de música que adivina qué canción te puede gustar.</li><li>El mapa que te dice por dónde hay menos tránsito.</li></ul>
<p>Pero ojo: la IA <strong>no piensa ni siente</strong> como vos. No está viva, no tiene ganas ni opiniones propias. Es una herramienta muy buena para encontrar patrones, como una calculadora gigante de ejemplos.</p>
<p class="ojo">💡 Idea clave: la IA es una herramienta hecha por personas. Hace algunas cosas increíblemente bien y otras muy mal.</p>`,
    preguntas: [
      { q: '¿Cuál de estas cosas usa IA?', o: ['Una linterna', 'Una app que reconoce qué planta es por una foto', 'Una regla', 'Un lápiz'], c: 1, e: 'Reconocer una planta en una foto es encontrar un patrón en una imagen: eso es justo lo que hace bien la IA.' },
      { q: '¿La IA tiene sentimientos?', o: ['Sí, se pone triste si la tratás mal', 'Solo los fines de semana', 'No, es un programa que encuentra patrones', 'Sí, igual que un perro'], c: 2, e: 'Aunque a veces escriba como si sintiera algo, la IA es un programa. No siente ni está viva.' },
      { q: '¿Quién crea la IA?', o: ['Personas: programadores, científicos y diseñadores', 'Se crea sola en internet', 'Los robots del espacio', 'Nadie, siempre existió'], c: 0, e: 'La IA la construyen personas, y por eso también puede tener los errores de las personas que la hicieron.' }
    ]
  },
  {
    emoji: '🐶', titulo: '¿Cómo aprende una máquina?',
    texto: `<p>¿Cómo le enseñarías a una computadora a distinguir un perro de un gato? Escribir todas las reglas ("si tiene orejas puntiagudas...") es casi imposible.</p>
<p>Por eso se usa el <strong>aprendizaje automático</strong> (en inglés <em>machine learning</em>): le mostramos <strong>miles de ejemplos</strong> con su respuesta ("esta foto es un perro", "esta es un gato") y el programa va ajustándose solo hasta acertar la mayoría de las veces. Es parecido a cuando aprendés a reconocer la letra de tus amigos: nadie te dio reglas, viste muchos ejemplos.</p>
<p>Los ejemplos se llaman <strong>datos de entrenamiento</strong>. Y acá viene lo importante: <strong>si los datos son malos, la IA aprende mal</strong>. Si solo le mostrás perros blancos, puede que no reconozca un perro negro.</p>
<p class="ojo">🧪 Probalo vos: en <a href="https://teachablemachine.withgoogle.com/" target="_blank" rel="noopener">Teachable Machine</a> (de Google, gratis, con un adulto) podés entrenar tu propia IA con la cámara: por ejemplo, que reconozca cuando levantás la mano y cuando no. Probá darle pocos ejemplos y después muchos: ¿cuándo acierta más?</p>`,
    preguntas: [
      { q: '¿Cómo aprende la IA a reconocer gatos?', o: ['Le leen un cuento de gatos', 'Viendo muchísimas fotos de gatos con la etiqueta "gato"', 'Adivinando sin ver nada', 'Preguntándole a un gato'], c: 1, e: 'Aprende de ejemplos: miles de fotos con su respuesta correcta.' },
      { q: 'Si entrenás una IA solo con fotos de perros blancos, ¿qué puede pasar?', o: ['Va a reconocer a todos los perros perfecto', 'Va a aprender a ladrar', 'Va a pintar los perros de blanco', 'Puede fallar con perros de otros colores'], c: 3, e: 'La IA aprende de lo que le mostrás. Si los ejemplos no son variados, falla con lo que nunca vio.' },
      { q: '¿Cómo se llaman los ejemplos que usa la IA para aprender?', o: ['Datos de entrenamiento', 'Tareas para el hogar', 'Contraseñas', 'Emojis'], c: 0, e: 'Se llaman datos de entrenamiento. ¡Su calidad importa muchísimo!' }
    ]
  },
  {
    emoji: '💬', titulo: '¿Cómo funciona un chatbot?',
    texto: `<p>Los <strong>chatbots</strong> como ChatGPT, Claude o Gemini parecen conversar, pero por dentro hacen algo sorprendente: <strong>adivinan cuál es la palabra que sigue</strong>, una y otra vez.</p>
<p>Probá completar: "Había una vez una princesa que vivía en un...". Seguro pensaste "castillo". El chatbot hace lo mismo, pero aprendió leyendo una cantidad enorme de textos, así que se volvió muy bueno para predecir qué viene después. A estos programas se los llama <strong>modelos de lenguaje</strong>.</p>
<p>Como predice palabras que "suenan bien", a veces escribe algo que <strong>suena muy seguro pero es falso</strong>. A eso se le dice que el modelo <strong>alucina</strong>: puede inventar un dato, una fecha o un libro que no existe.</p>
<p class="ojo">⚠️ Por eso: nunca copies una respuesta de un chatbot sin revisarla en otra fuente, sobre todo para la escuela.</p>`,
    preguntas: [
      { q: '¿Qué hace un chatbot por dentro para escribir?', o: ['Busca la respuesta en un libro secreto', 'Llama por teléfono a un experto', 'Predice la siguiente palabra muchas veces seguidas', 'Copia lo que escribió otro chico'], c: 2, e: 'Un modelo de lenguaje genera el texto prediciendo la palabra que sigue, una tras otra.' },
      { q: 'Un chatbot te dice muy seguro el nombre de un libro, pero el libro no existe. ¿Qué pasó?', o: ['El libro se borró de internet', 'El chatbot alucinó: inventó algo que suena creíble', 'Vos leíste mal', 'El chatbot te quiso engañar a propósito'], c: 1, e: 'Se llama alucinación. No es a propósito: el modelo genera texto que suena bien aunque no sea verdad.' },
      { q: '¿Qué conviene hacer con un dato que te dio un chatbot para un trabajo práctico?', o: ['Copiarlo tal cual, siempre tiene razón', 'Revisarlo en otra fuente confiable', 'Inventar otro dato', 'Ignorar todo lo que dice'], c: 1, e: 'El chatbot puede ayudar, pero los datos se verifican en otra fuente (un libro, una página oficial o tu docente).' }
    ]
  },
  {
    emoji: '🎯', titulo: 'Cómo pedirle bien las cosas a una IA',
    texto: `<p>Lo que le escribís a una IA se llama <strong>prompt</strong> (se pronuncia "prompt"). Un buen prompt es como una buena consigna: cuanto más clara, mejor el resultado.</p>
<p>Comparalas:</p>
<ul><li>❌ "Contame de los volcanes."</li><li>✅ "Explicame cómo se forma un volcán como si tuviera 11 años, en 5 oraciones, y terminá con un dato curioso."</li></ul>
<p>El segundo dice <strong>qué</strong> querés, <strong>para quién</strong> es y <strong>cómo</strong> lo querés. Tres trucos que funcionan:</p>
<ol><li><strong>Dale contexto:</strong> "Estoy estudiando para una prueba de ciencias de 6.º grado".</li><li><strong>Pedí un formato:</strong> una lista, una tabla, un resumen corto.</li><li><strong>Pedile que te enseñe, no que lo haga por vos:</strong> "Haceme 3 preguntas para ver si entendí la fotosíntesis".</li></ol>
<p class="ojo">🌟 El tercer truco es el superpoder: usar la IA como un profe que te toma examen te hace aprender de verdad.</p>`,
    preguntas: [
      { q: '¿Qué es un prompt?', o: ['Un tipo de robot', 'Lo que le escribís a la IA para pedirle algo', 'Un virus de computadora', 'Una tecla del teclado'], c: 1, e: 'El prompt es tu pedido o consigna para la IA.' },
      { q: '¿Cuál es el mejor prompt?', o: ['"Volcanes"', '"Decime algo"', '"Explicame cómo se forma un volcán para alguien de 11 años, en 5 oraciones"', '"Hola"'], c: 2, e: 'Dice qué querés, para quién y en qué formato. Así la IA sabe exactamente qué hacer.' },
      { q: '¿Cuál es la forma más inteligente de usar la IA para estudiar?', o: ['Que haga toda la tarea por vos', 'Pedirle que te haga preguntas para practicar', 'No leer nada de lo que dice', 'Copiar y pegar sin mirar'], c: 1, e: 'Si te toma examen, sos vos quien aprende. Si hace la tarea por vos, aprende... nadie.' }
    ]
  },
  {
    emoji: '🛡️', titulo: 'Usar la IA de forma segura',
    texto: `<p>Las reglas de seguridad de internet también valen con la IA:</p>
<ul><li><strong>No compartas datos personales:</strong> tu nombre completo, dirección, escuela, teléfono, contraseñas ni fotos tuyas o de otros.</li><li><strong>Usala con un adulto:</strong> muchas apps de IA piden tener al menos 13 años o permiso de tus padres. Revisalo con ellos antes.</li><li><strong>Si algo te incomoda, cortá y avisá</strong> a un adulto de confianza.</li></ul>
<p>Otro tema: con IA se pueden crear <strong>fotos, voces y videos falsos</strong> que parecen reales (se llaman <em>deepfakes</em>). Antes de creer o compartir algo sorprendente, preguntate: ¿quién lo publicó?, ¿lo dice algún medio confiable?</p>
<p>Y nunca uses la IA para burlarte de alguien o hacer imágenes de otras personas sin su permiso: eso lastima, y puede ser grave.</p>
<p class="ojo">🔐 Regla de oro: si no se lo dirías a un desconocido en la calle, no se lo escribas a una IA.</p>`,
    preguntas: [
      { q: '¿Qué está bien escribirle a un chatbot?', o: ['Tu dirección', 'Tu contraseña', 'Una pregunta sobre cómo funcionan los planetas', 'El teléfono de tu mamá'], c: 2, e: 'Preguntas sobre temas para aprender, sí. Datos personales, nunca.' },
      { q: 'Ves un video de un famoso diciendo algo muy raro. ¿Qué hacés?', o: ['Lo comparto enseguida', 'Desconfío: puede ser un deepfake, y busco si lo confirma un medio confiable', 'Lo creo porque es un video', 'Le escribo insultos'], c: 1, e: 'La IA puede crear videos falsos muy realistas. Antes de creer o compartir, verificá.' },
      { q: 'Un chat con IA te hace sentir incómodo. ¿Qué es lo mejor?', o: ['Seguir para ver qué pasa', 'No contarle a nadie', 'Cortar y avisarle a un adulto de confianza', 'Darle tus datos para que pare'], c: 2, e: 'Siempre podés cortar y pedir ayuda. Contarlo nunca es un problema.' }
    ]
  },
  {
    emoji: '⚖️', titulo: 'IA justa y honesta',
    texto: `<p>Como la IA aprende de datos hechos por personas, también puede aprender sus <strong>prejuicios</strong>. Por ejemplo, si en los ejemplos casi todos los médicos son hombres, una IA que dibuja "un médico" puede dibujar siempre a un hombre. A eso se le llama <strong>sesgo</strong>.</p>
<p>Los ingenieros que hacen IA trabajan para detectarlo y corregirlo, y vos podés notarlo también: si ves que una IA trata distinto a algunas personas, eso es un error, no "la verdad".</p>
<p>La <strong>honestidad</strong> también importa: si usaste IA para un trabajo, decilo. Muchos docentes te dejan usarla para buscar ideas o practicar, pero entregar como propio algo que escribió una máquina no es justo para vos ni para tus compañeros. Y lo más importante: <strong>tu cerebro crece cuando lo usás</strong>.</p>
<p class="ojo">🚀 El futuro: quienes entienden cómo funciona la IA pueden crearla y mejorarla. ¡Vos podés ser uno de ellos!</p>`,
    preguntas: [
      { q: 'Una IA siempre dibuja a los científicos como hombres. ¿Qué está pasando?', o: ['Es un sesgo que aprendió de sus datos', 'Es la verdad: solo hay científicos hombres', 'La IA está cansada', 'Es una regla de la ciencia'], c: 0, e: 'Es un sesgo: la IA repite los patrones (y los prejuicios) que había en sus ejemplos.' },
      { q: 'Usaste IA para buscar ideas para tu trabajo. ¿Qué es lo honesto?', o: ['Esconderlo', 'Decirle a tu docente cómo la usaste', 'Decir que la IA lo hizo todo aunque no sea así', 'Borrar el trabajo'], c: 1, e: 'Contar cómo usaste la IA es honesto, y tu docente te puede ayudar a usarla mejor.' },
      { q: '¿Por qué conviene hacer vos la tarea aunque la IA pueda hacerla?', o: ['Porque la IA cobra muy caro', 'Porque es más divertido sufrir', 'Porque la IA no sabe escribir', 'Porque tu cerebro aprende cuando lo usás'], c: 3, e: 'La tarea es para entrenar tu cerebro. Si la hace otro, el que no aprende sos vos.' }
    ]
  }
];

const app = document.getElementById('app');
// Siguiente paso al terminar todas: el primer módulo del curso completo
const SIGUIENTE = '<p>🚀 <strong>¿Querés ir más lejos?</strong> El curso completo de AI Engineering empieza por <a href="../#/m/fundamentos">Fundamentos</a>. Es para chicos más grandes y adultos, pero podés mirarlo con alguien que te acompañe.</p>';
const cargar = () => { try { return JSON.parse(localStorage.getItem('chicos')) || {}; } catch { return {}; } };
const guardar = p => localStorage.setItem('chicos', JSON.stringify(p));

function inicio() {
  const p = cargar();
  const total = Object.values(p).reduce((a, b) => a + b, 0);
  app.innerHTML = `<p class="estrellas">⭐ Tenés <strong>${total}</strong> de ${MISIONES.length * 3} estrellas</p>
    ${Object.keys(p).length === MISIONES.length ? SIGUIENTE : ''}
    <div class="misiones">${MISIONES.map((m, i) => `<button class="mision" data-i="${i}"><span class="emoji">${m.emoji}</span><strong>Misión ${i + 1}</strong><br>${m.titulo}<br><small>${'⭐'.repeat(p[i] || 0) || 'Sin empezar'}</small></button>`).join('')}</div>`;
  app.querySelectorAll('.mision').forEach(b => b.onclick = () => { location.hash = '#/' + b.dataset.i; });
}

function mision(i) {
  const m = MISIONES[i];
  let aciertos = 0, respondidas = 0;
  app.innerHTML = `<a href="#/" class="pista">← Volver a las misiones</a>
    <article><h2>${m.emoji} Misión ${i + 1}: ${m.titulo}</h2>${m.texto}
    <h3>🎮 ¿Lo entendiste?</h3>
    ${m.preguntas.map((q, k) => `<div class="pregunta" data-k="${k}"><strong>${k + 1}. ${q.q}</strong>${q.o.map((o, j) => `<button data-j="${j}">${o}</button>`).join('')}<p class="pista" hidden></p></div>`).join('')}
    <p id="final"></p></article>`;
  app.querySelectorAll('.pregunta').forEach(div => {
    const q = m.preguntas[div.dataset.k];
    div.querySelectorAll('button').forEach(b => b.onclick = () => {
      if (div.dataset.hecha) return;
      div.dataset.hecha = '1';
      const bien = Number(b.dataset.j) === q.c;
      b.classList.add(bien ? 'bien' : 'mal');
      div.querySelectorAll('button')[q.c].classList.add('bien');
      const pista = div.querySelector('.pista');
      pista.hidden = false;
      pista.textContent = (bien ? '¡Bien! ' : 'Casi. ') + q.e;
      aciertos += bien; respondidas++;
      if (respondidas === m.preguntas.length) {
        const p = cargar(); p[i] = Math.max(p[i] || 0, aciertos); guardar(p);
        const sig = i + 1 < MISIONES.length ? `<a class="boton" href="#/${i + 1}">Siguiente misión →</a>` : '<a class="boton" href="#/">🏆 ¡Terminaste todas! Ver mis estrellas</a>' + SIGUIENTE;
        app.querySelector('#final').innerHTML = `<strong>Ganaste ${'⭐'.repeat(aciertos) || '0 estrellas'}</strong> (${aciertos} de ${m.preguntas.length}). ${aciertos < 3 ? 'Podés volver a intentarlo cuando quieras.' : '¡Perfecto!'}<br>${sig}`;
      }
    });
  });
  scrollTo(0, 0);
}

function rutear() {
  const i = Number(location.hash.slice(2));
  if (location.hash.length > 2 && MISIONES[i]) mision(i); else inicio();
}
addEventListener('hashchange', rutear);
rutear();
</script>
</body>
</html>

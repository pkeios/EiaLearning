<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IA para chicos — misiones</title>
<style>
  :root { --fondo: #fff8ec; --texto: #2b2340; --suave: #6b6280; --bien: #1f9d55; --mal: #d64545; --color: #7b5cff; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 20px/1.5 system-ui, "Segoe UI", sans-serif; background: var(--fondo); color: var(--texto); }
  header { background: linear-gradient(135deg, #7b5cff, #ff7a59); color: #fff; padding: 1rem; text-align: center; }
  header h1 { margin: 0; font-size: 1.7rem; }
  header a { color: #fff; text-decoration: none; }
  main { max-width: 680px; margin: 0 auto; padding: 1rem; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .estrellas { text-align: center; font-size: 1.3rem; margin: .5rem 0 1rem; }
  .misiones { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: .9rem; }
  .mision { background: #fff; border: 4px solid var(--c); border-radius: 22px; padding: 1rem; text-align: center; transition: transform .15s; }
  .mision:hover, .mision:focus-visible { transform: scale(1.04); }
  .mision .emoji { font-size: 3.2rem; display: block; }
  .mision small { display: block; margin-top: .3rem; font-size: 1.1rem; }
  .barra { display: flex; gap: .4rem; justify-content: center; margin: .5rem 0 1rem; }
  .barra span { width: 14px; height: 14px; border-radius: 50%; background: #e4dcf7; }
  .barra span.hecho { background: var(--color); }
  .tarjeta { background: #fff; border-radius: 26px; padding: 1.5rem; text-align: center; border: 4px solid var(--color); box-shadow: 0 6px 0 var(--color); animation: entra .3s ease; }
  @keyframes entra { from { transform: translateY(12px); opacity: 0; } }
  .grande { font-size: 5rem; line-height: 1.1; margin: .2rem 0 .6rem; }
  .texto { font-size: 1.35rem; font-weight: 600; margin: 0 0 .5rem; }
  .opciones { display: grid; gap: .6rem; margin-top: 1rem; }
  .opcion { padding: .8rem 1rem; border-radius: 18px; border: 3px solid #e4dcf7; background: #fbf9ff; font-size: 1.2rem; }
  .opcion:hover:not(:disabled) { border-color: var(--color); }
  .opcion.bien, .chip.bien { border-color: var(--bien); background: #e7f7ee; }
  .opcion.mal, .chip.mal { border-color: var(--mal); background: #fdecec; animation: sacude .3s; }
  @keyframes sacude { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .chips { display: grid; gap: .6rem; margin-top: 1rem; text-align: left; }
  .chip { display: flex; align-items: center; gap: .5rem; padding: .5rem .7rem; border-radius: 16px; border: 3px solid #e4dcf7; background: #fbf9ff; }
  .chip span { flex: 1; }
  .chip button { border: 0; border-radius: 12px; padding: .35rem .6rem; background: #efe9ff; font-size: 1.1rem; }
  .chip button:disabled { opacity: .35; cursor: default; }
  .aviso { min-height: 2.2rem; margin: .8rem 0 0; font-weight: 600; }
  .aviso.bien { color: var(--bien); } .aviso.mal { color: var(--mal); }
  .acciones { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; gap: .5rem; }
  .boton { background: #ff7a59; color: #fff; border: 0; border-radius: 999px; padding: .7rem 1.4rem; font-weight: 700; text-decoration: none; box-shadow: 0 4px 0 #d9583a; }
  .boton:disabled { background: #cfc8dc; box-shadow: none; cursor: default; }
  .chico { background: none; border: 0; font-size: 1.6rem; }
  .volver { color: var(--suave); text-decoration: none; }
  .fiesta { font-size: 3rem; letter-spacing: .3rem; }
  footer { text-align: center; color: var(--suave); font-size: .85rem; padding: 2rem 1rem; }
  .seccion { text-align: center; margin: 2rem 0 .8rem; }
  input[type=text], textarea { width: 100%; font: inherit; padding: .6rem .8rem; border-radius: 14px; border: 3px solid #e4dcf7; margin: .4rem 0; }
  textarea { font-size: 1rem; }
  .fila { display: flex; gap: .5rem; justify-content: center; flex-wrap: wrap; margin: .4rem 0; }
  .prob { display: flex; align-items: center; gap: .5rem; margin: .3rem 0; }
  .prob div { height: 22px; border-radius: 11px; background: var(--color); min-width: 4px; }
  .grilla { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; max-width: 300px; margin: 1rem auto; }
  .celda { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; background: #f3effd; border-radius: 10px; }
  .suave { color: var(--suave); font-size: .95rem; font-weight: 400; }
  .programa { min-height: 2.4rem; font-size: 1.5rem; letter-spacing: .15rem; word-break: break-all; }
</style>
</head>
<body>
<header><h1><a href="#/">🤖 IA para chicos</a></h1></header>
<main id="app"></main>
<footer>Para adultos: 6 misiones de unos 5 minutos, para chicos de 10 a 13 años. Las estrellas se guardan solo en este navegador.<br><a href="../">Curso completo de AI Engineering</a></footer>
<script>
// Pasos: idea (emoji + frase corta), elegir (una correcta) y clasificar (cada ítem en su grupo).
// Cada misión tiene 3 ejercicios: una estrella por cada uno resuelto al primer intento.
const MISIONES = [
  { emoji: '🧠', titulo: '¿Qué es la IA?', color: '#7b5cff', pasos: [
    { idea: '🤖', t: 'La IA es un programa que aprende a encontrar patrones.' },
    { idea: '📱 🎵 🗺️', t: 'Ya la usás: el celu que reconoce tu cara, la música que te recomienda, el mapa que esquiva el tránsito.' },
    { clasificar: '¿Usa IA o no?', grupos: ['🤖 IA', '🔧 No'], items: [['📷 Cámara que reconoce caras', 0], ['🔦 Linterna', 1], ['🎬 App que te recomienda videos', 0], ['📏 Regla', 1], ['🗣️ Asistente que entiende tu voz', 0]] },
    { idea: '💡', t: 'La IA no piensa ni siente. No está viva: es una herramienta.' },
    { q: '¿La IA tiene sentimientos?', o: ['😢 Sí, se pone triste', '🙅 No, es un programa'], c: 1, e: 'Aunque a veces escriba como una persona, no siente nada.' },
    { q: '¿Quién hace la IA?', o: ['👩‍💻 Personas', '🌧️ Aparece sola', '👽 Extraterrestres'], c: 0, e: 'La hacen personas. Por eso también puede tener sus errores.' },
  ] },
  { emoji: '🐶', titulo: '¿Cómo aprende?', color: '#ff7a59', pasos: [
    { idea: '📚 👀', t: 'La máquina aprende viendo MUCHOS ejemplos. ¡Como vos!' },
    { clasificar: 'Enseñale a la máquina: ¿perro o gato?', grupos: ['🐶 Perro', '🐱 Gato'], items: [['🐕', 0], ['🐈', 1], ['🐩', 0], ['🐈‍⬛', 1], ['🦮', 0]] },
    { idea: '🏷️', t: 'Lo que hiciste se llama "etiquetar". Son los datos de entrenamiento.' },
    { taller: 'entrenar', t: '¡Tu turno! Entrená una IA con tus propias frases.' },
    { idea: '🔴 🔴 🔴 ❓', t: 'Si solo ve ejemplos parecidos, se confunde con lo nuevo.' },
    { q: 'La máquina solo vio pelotas rojas 🔴. Le mostrás una azul 🔵. ¿Qué pasa?', o: ['😵 Puede confundirse', '🎯 Seguro acierta'], c: 0, e: 'Nunca vio una pelota azul. Aprende solo de lo que le mostraste.' },
    { q: '¿Qué necesita para aprender mejor?', o: ['🍕 Pizza', '🌈 Ejemplos variados', '😴 Dormir'], c: 1, e: 'Ejemplos variados = una IA que se equivoca menos.' },
  ] },

    { idea: '🔮', t: 'Un chatbot adivina la palabra que sigue. Una y otra vez.' },
    { q: 'Completá: "Había una vez una princesa en un gran..."', o: ['🥦 brócoli', '🚀 cohete', '🏰 castillo'], c: 2, e: '¡Eso hace un chatbot! Elige la palabra que más vio en los textos.' },

    { q: '¿El chatbot siempre tiene razón?', o: ['👎 No, puede equivocarse', '👍 Sí, siempre'], c: 0, e: 'Es muy útil, pero se equivoca. Vos sos quien revisa.' },
  ] },
  { emoji: '🎯', titulo: 'Pedir bien', color: '#e0a100', pasos: [
    { idea: '✍️', t: 'Lo que le escribís a la IA se llama "prompt". Cuanto más claro, mejor.' },
    { q: '¿Qué prompt es mejor?', o: ['😐 "Volcanes"', '🌋 "Explicame cómo se forma un volcán en 3 frases, para alguien de 11 años"'], c: 1, e: 'Dice qué querés, para quién y cómo.' },
    { idea: '🤖 📋', t: 'Las computadoras hacen EXACTO lo que les decís. Por eso las instrucciones claras importan.' },
    { taller: 'robot', t: '¡Tu turno! Dale instrucciones exactas al robot.' },
    { clasificar: '¿Esto ayuda a que la IA te entienda?', grupos: ['✅ Ayuda', '❌ No'], items: [['Decir para quién es', 0], ['Escribir una sola palabra', 1], ['Pedir una lista o 3 frases', 0], ['Escribir TODO EN MAYÚSCULAS', 1], ['Contar para qué lo necesitás', 0]] },
    { idea: '🌟', t: 'Superpoder: pedile que te haga preguntas para practicar.' },
    { q: '¿Qué te ayuda a aprender más?', o: ['📝 "Haceme la tarea"', '🧠 "Haceme 3 preguntas sobre las plantas"'], c: 1, e: 'Si te toma examen, aprendés vos.' },
  ] },
  { emoji: '🛡️', titulo: 'Seguridad', color: '#1f9d55', pasos: [

    { clasificar: '¿Se lo puedo escribir a una IA?', grupos: ['👍 Sí', '🚫 No'], items: [['¿Por qué el cielo es azul?', 0], ['Mi dirección', 1], ['Mi contraseña', 1], ['Ideas para un cuento de dragones', 0], ['El teléfono de mi familia', 1]] },
    { taller: 'tapar', t: '¡Tu turno! Tapá los datos personales antes de mandar el mensaje.' },
    { idea: '🎭', t: 'Con IA se pueden hacer fotos y videos falsos que parecen reales.' },
    { q: 'Ves un video de un famoso diciendo algo rarísimo. ¿Qué hacés?', o: ['📤 Lo comparto ya', '🤔 Desconfío y le pregunto a un adulto'], c: 1, e: 'Puede ser falso. Antes de creer o compartir, preguntá.' },
    { idea: '🙋', t: 'Si algo te hace sentir incómodo, cortá y contale a un adulto.' },
    { q: 'Un chat te hace sentir incómodo. ¿Qué hacés?', o: ['🙋 Corto y le cuento a un adulto', '🤐 No le cuento a nadie'], c: 0, e: 'Contarlo siempre está bien.' },
  ] },
  { emoji: '⚖️', titulo: 'Justa y honesta', color: '#d6457a', pasos: [
    { idea: '🪞', t: 'La IA copia lo que ve en sus ejemplos. También los errores de las personas.' },
    { q: 'Una IA siempre dibuja a los científicos como hombres 👨‍🔬. ¿Está bien?', o: ['✅ Sí, es así', '❌ No, es un error: hay muchas científicas 👩‍🔬'], c: 1, e: 'Se llama sesgo. La IA repite lo que más vio, aunque no sea justo.' },
    { idea: '🤝', t: 'Si usaste IA para un trabajo, contalo.' },
    { q: 'Usaste IA para buscar ideas. ¿Qué hacés?', o: ['🗣️ Le cuento a mi profe cómo la usé', '🙈 Lo escondo'], c: 0, e: 'Ser honesto con la IA es igual que con todo lo demás.' },
    { idea: '💪', t: 'Tu cerebro crece cuando lo usás. La IA ayuda, no te reemplaza.' },
    { q: '¿Quién tiene que aprender en la escuela?', o: ['🤖 La IA', '🧒 ¡Yo!'], c: 1, e: '¡Exacto! La IA es tu ayudante.' },
  ] },
];

const app = document.getElementById('app');
const cargar = () => { try { return JSON.parse(localStorage.getItem('chicos')) || {}; } catch { return {}; } };
const guardar = p => localStorage.setItem('chicos', JSON.stringify(p));
const SIGUIENTE = '<p>🚀 <strong>¿Querés más?</strong> Con alguien que te acompañe, podés mirar el primer módulo del <a href="../#/m/fundamentos">curso completo</a>.</p>';

// Voz: español latino si el dispositivo tiene una
function leer(texto) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const voces = speechSynthesis.getVoices().filter(v => /^es/i.test(v.lang));
  const voz = voces.find(v => /^es[-_](419|AR|MX|US|CO|CL|PE|UY)/i.test(v.lang)) || voces.find(v => !/^es[-_]ES/i.test(v.lang)) || voces[0];
  speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(texto.replace(/\p{Extended_Pictographic}/gu, '')), { lang: 'es-419', voice: voz || null, rate: .95 }));
}

function inicio() {
  const p = cargar(), total = Object.values(p).reduce((a, b) => a + b, 0);
  app.innerHTML = `<p class="estrellas">⭐ <strong>${total}</strong> de ${MISIONES.length * 3} estrellas</p>
    ${Object.keys(p).length === MISIONES.length ? SIGUIENTE : ''}
    <div class="misiones">${MISIONES.map((m, i) => `<button class="mision" style="--c:${m.color}" data-i="${i}">
      <span class="emoji">${m.emoji}</span><strong>${i + 1}. ${m.titulo}</strong><small>${p[i] != null ? '⭐'.repeat(p[i]) + '☆'.repeat(3 - p[i]) : '▶️ Jugar'}</small></button>`).join('')}</div>
    <h2 class="seccion">🛠️ Taller: ¡ahora hacelo vos!</h2>
    <div class="misiones">${TALLER.map(t => `<button class="mision" style="--c:${t.color}" data-t="${t.id}">
      <span class="emoji">${t.emoji}</span><strong>${t.titulo}</strong><small>${cargarTaller()[t.id] ? '✅ Hecho' : '🛠️ Probar'}</small></button>`).join('')}</div>`;
  app.querySelectorAll('.mision').forEach(b => b.onclick = () => { location.hash = b.dataset.t ? '#/taller/' + b.dataset.t : '#/' + b.dataset.i; });
}

function mision(i) {
  const m = MISIONES[i];
  document.documentElement.style.setProperty('--color', m.color);
  let paso = 0, estrellas = 0;
  const mostrar = () => {
    if (paso === m.pasos.length) return final();
    const s = m.pasos[paso], ejercicio = !s.idea;
    let primerIntento = true;
    const dicho = s.idea || s.taller ? s.t : s.q || s.clasificar;
    app.innerHTML = `<a class="volver" href="#/">← Misiones</a>
      <div class="barra">${m.pasos.map((_, k) => `<span class="${k <= paso ? 'hecho' : ''}"></span>`).join('')}</div>
      <section class="tarjeta">
        ${s.idea ? `<div class="grande">${s.idea}</div><p class="texto">${s.t}</p>` : ''}
        ${s.taller ? `<p class="texto">${s.t}</p><div id="actividad"></div>` : ''}
        ${s.q ? `<p class="texto">${s.q}</p><div class="opciones">${s.o.map((o, j) => `<button class="opcion" data-j="${j}">${o}</button>`).join('')}</div>` : ''}
        ${s.clasificar ? `<p class="texto">${s.clasificar}</p><div class="chips">${s.items.map(([t], k) => `<div class="chip" data-k="${k}"><span>${t}</span>${s.grupos.map((g, j) => `<button data-g="${j}">${g}</button>`).join('')}</div>`).join('')}</div>` : ''}
        <p class="aviso" aria-live="polite"></p>
        <div class="acciones"><button class="chico" id="oir" aria-label="Escuchar">🔊</button><button class="boton" id="seguir" ${ejercicio ? 'disabled' : ''}>Seguir →</button></div>
      </section>`;
    const aviso = app.querySelector('.aviso'), seguir = app.querySelector('#seguir');
    const listo = () => { if (primerIntento) estrellas++; seguir.disabled = false; seguir.focus(); };
    app.querySelector('#oir').onclick = () => leer(dicho + (s.o ? '. ' + s.o.join('. ') : ''));
    seguir.onclick = () => { clearInterval(corriendo); paso++; mostrar(); };
    if (s.taller) montarTaller(s.taller, app.querySelector('#actividad'), () => { logro(s.taller); seguir.disabled = false; });
    app.querySelectorAll('.opcion').forEach(b => b.onclick = () => {
      if (Number(b.dataset.j) === s.c) {
        b.classList.add('bien');
        app.querySelectorAll('.opcion').forEach(x => x.disabled = true);
        aviso.className = 'aviso bien'; aviso.textContent = '🎉 ¡Bien! ' + s.e;
        listo();
      } else {
        primerIntento = false;
        b.classList.add('mal'); b.disabled = true;
        aviso.className = 'aviso mal'; aviso.textContent = '🤔 Casi... ¡probá otra!';
      }
    });
    let faltan = s.items?.length || 0;
    app.querySelectorAll('.chip').forEach(chip => chip.querySelectorAll('button').forEach(b => b.onclick = () => {
      const bien = Number(b.dataset.g) === s.items[chip.dataset.k][1];
      chip.classList.remove('mal'); void chip.offsetWidth;
      chip.classList.add(bien ? 'bien' : 'mal');
      if (!bien) { primerIntento = false; aviso.className = 'aviso mal'; aviso.textContent = '🤔 Ese no va ahí. ¡Probá el otro!'; return; }
      chip.querySelectorAll('button').forEach(x => x.disabled = true);
      aviso.className = 'aviso bien'; aviso.textContent = '✅ ¡Bien!';
      if (--faltan === 0) { aviso.textContent = '🎉 ¡Todos en su lugar!'; listo(); }
    }));
  };
  const final = () => {
    const p = cargar(); p[i] = Math.max(p[i] || 0, estrellas); guardar(p);
    const todas = Object.keys(p).length === MISIONES.length;
    app.innerHTML = `<section class="tarjeta">
      <div class="fiesta">🎉🎊🎉</div>
      <p class="texto">¡Misión ${i + 1} cumplida!</p>
      <div class="grande">${'⭐'.repeat(estrellas) + '☆'.repeat(3 - estrellas)}</div>
      <p>${estrellas === 3 ? '¡Perfecto, todo al primer intento!' : 'Podés volver a jugarla para ganar más estrellas.'}</p>
      ${todas ? SIGUIENTE : ''}
      <div class="acciones"><a class="volver" href="#/">← Misiones</a>${i + 1 < MISIONES.length ? `<a class="boton" href="#/${i + 1}">Siguiente misión →</a>` : '<a class="boton" href="#/">🏆 Ver mis estrellas</a>'}</div>
    </section>`;
  };
  mostrar();
  scrollTo(0, 0);
}

// ---------- Taller: actividades prácticas (todo corre en el navegador) ----------
const TALLER = [
  { id: 'entrenar', emoji: '🧪', titulo: 'Entrená tu IA', color: '#ff7a59' },
  { id: 'palabras', emoji: '✍️', titulo: 'Autocompletar', color: '#1f9dd6' },
  { id: 'robot', emoji: '🤖', titulo: 'Programá el robot', color: '#1f9d55' },
  { id: 'tapar', emoji: '🕵️', titulo: 'Tapá los datos', color: '#d6457a' },
];
const cargarTaller = () => { try { return JSON.parse(localStorage.getItem('chicos-taller')) || {}; } catch { return {}; } };
const logro = id => { const t = cargarTaller(); t[id] = true; localStorage.setItem('chicos-taller', JSON.stringify(t)); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const palabrasDe = (t, min = 2) => t.toLowerCase().split(/[^\p{L}]+/u).filter(w => w.length >= min);

// Clasificador de palabras (Naive Bayes): la frase va al grupo donde sus palabras aparecieron más.
function predecir(ejemplos, frase) {
  const grupos = [0, 1].map(g => {
    const c = {}, deG = ejemplos.filter(e => e.g === g);
    let n = 0;
    deG.forEach(e => palabrasDe(e.t).forEach(w => { c[w] = (c[w] || 0) + 1; n++; }));
    return { c, n, docs: deG.length };
  });
  const vocab = new Set(ejemplos.flatMap(e => palabrasDe(e.t))).size || 1;
  const ws = palabrasDe(frase);
  const puntos = grupos.map(G => Math.log((G.docs + 1) / (ejemplos.length + 2)) + ws.reduce((s, w) => s + Math.log(((G.c[w] || 0) + 1) / (G.n + vocab)), 0));
  const e = puntos.map(x => Math.exp(x - Math.max(...puntos)));
  const claves = [...new Set(ws.filter(w => grupos[0].c[w] || grupos[1].c[w]))]
    .map(w => [w, (grupos[0].c[w] || 0) / (grupos[0].n || 1) >= (grupos[1].c[w] || 0) / (grupos[1].n || 1) ? 0 : 1]);
  return { prob: e.map(x => x / (e[0] + e[1])), claves };
}

// Autocompletar: para cada palabra, cuenta qué palabras vinieron después (un "modelo de lenguaje" chiquito).
function aprenderTexto(texto) {
  const ws = palabrasDe(texto, 1), sig = {};
  for (let i = 0; i + 1 < ws.length; i++) { sig[ws[i]] ??= {}; sig[ws[i]][ws[i + 1]] = (sig[ws[i]][ws[i + 1]] || 0) + 1; }
  return sig;
}
const siguientes = (sig, w) => Object.entries(sig[w] || {}).sort((a, b) => b[1] - a[1]);
function escribirSola(sig, inicio, n = 12, azar = Math.random) {
  const out = [inicio];
  let w = inicio;
  for (let i = 0; i < n; i++) {
    const ops = siguientes(sig, w);
    if (!ops.length) break;
    let r = azar() * ops.reduce((s, [, c]) => s + c, 0);
    w = ops.find(([, c]) => (r -= c) < 0)[0];
    out.push(w);
  }
  return out.join(' ');
}

// Robot: R inicio, E estrella, # pared.
const NIVELES = [
  ['R....', '.....', '.....', '.....', '....E'],
  ['R.#..', '..#..', '..#.E', '.....', '.....'],
  ['R#...', '.#.#.', '.#.#.', '...#E', '###..'],
];
let corriendo = null; // animación del robot: se corta al cambiar de página
const DIR = { '⬆️': [-1, 0], '⬇️': [1, 0], '⬅️': [0, -1], '➡️': [0, 1] };
function correrRobot(mapa, prog) {
  let r = mapa.findIndex(f => f.includes('R')), c = mapa[r].indexOf('R');
  const camino = [[r, c]];
  for (const p of prog) {
    const [nr, nc] = [r + DIR[p][0], c + DIR[p][1]];
    if (!mapa[nr] || mapa[nr][nc] === undefined || mapa[nr][nc] === '#') return { camino, fin: 'choque' };
    [r, c] = [nr, nc];
    camino.push([r, c]);
    if (mapa[r][c] === 'E') return { camino, fin: 'estrella' };
  }
  return { camino, fin: 'corto' };
}

// Mensaje para tapar: 1 = dato personal (hay que taparlo), 2 = parece importante pero se puede preguntar, 0 = texto.
const MENSAJE = [
  ['Hola IA, soy ', 0], ['Martina López', 1], [', vivo en ', 0], ['Calle Las Flores 123', 1], [' y voy a la ', 0],
  ['Escuela N° 5', 1], ['. Mi contraseña es ', 0], ['gatito99', 1], ['. ¿Me ayudás con la tarea de ', 0], ['los volcanes', 2], [' para el ', 0], ['jueves', 2], ['?', 0],
];
const DEMO = [
  ['hoy gané el partido de fútbol', 0], ['me encanta jugar con mis amigos', 0], ['saqué un diez en la prueba', 0], ['mañana vamos a la playa', 0],
  ['se me rompió el juguete', 1], ['perdí mi cartuchera nueva', 1], ['hoy llueve y no puedo salir', 1], ['me peleé con mi amigo', 1],
];
const CUENTO = 'Había una vez un robot que quería aprender. El robot leía libros todos los días. Un día el robot leyó un libro de dragones. El dragón quería volar y el robot quería leer. Al final el robot y el dragón fueron amigos.';

// Monta una actividad en cont. alLograr(ultimo) se llama al completarla (en el robot, en cada nivel; ultimo = último nivel).
function montarTaller(id, cont, alLograr) {
  if (id === 'entrenar') {
    let ejemplos = [];
    cont.innerHTML = (`<div class="grande">🧪</div>
      <p class="texto">Enseñale a la máquina: escribí frases y decile si son alegres o tristes.</p>
      <input type="text" id="frase" placeholder="Ej: hoy jugué con mi perro" aria-label="Frase de ejemplo">
      <div class="fila"><button class="opcion" data-g="0">😀 Alegre</button><button class="opcion" data-g="1">😢 Triste</button></div>
      <div class="chips" id="lista"></div>
      <button class="chico" id="demo" style="font-size:1rem">✨ Cargar ejemplos</button>
      <p class="texto" style="margin-top:1.2rem">🔍 Ahora probá tu IA con una frase nueva</p>
      <input type="text" id="prueba" placeholder="Ej: gané la carrera" aria-label="Frase para probar">
      <button class="boton" id="probar">Adivinar</button>
      <div id="resultado" class="aviso" aria-live="polite"></div>`);
    const lista = cont.querySelector('#lista'), res = cont.querySelector('#resultado');
    const dibujar = () => { lista.innerHTML = ejemplos.map(e => `<div class="chip"><span>${e.g ? '😢' : '😀'} ${esc(e.t)}</span></div>`).join(''); };
    cont.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
      const inp = cont.querySelector('#frase');
      if (!palabrasDe(inp.value).length) return inp.focus();
      ejemplos.push({ t: inp.value.trim(), g: Number(b.dataset.g) });
      inp.value = ''; inp.focus(); dibujar();
    });
    cont.querySelector('#demo').onclick = () => { ejemplos = DEMO.map(([t, g]) => ({ t, g })); dibujar(); };
    cont.querySelector('#probar').onclick = () => {
      const frase = cont.querySelector('#prueba').value;
      if ([0, 1].some(g => ejemplos.filter(e => e.g === g).length < 3)) { res.className = 'aviso mal'; res.textContent = '🤔 Necesito al menos 3 ejemplos de cada tipo para aprender.'; return; }
      const { prob, claves } = predecir(ejemplos, frase);
      res.className = 'aviso';
      if (!claves.length) { res.innerHTML = '🤷 No conozco ninguna de esas palabras. ¡Enseñame más ejemplos! (Las IAs necesitan muchos datos.)'; return; }
      res.innerHTML = `<div class="prob">😀 <div style="width:${Math.round(prob[0] * 70)}%"></div> ${Math.round(prob[0] * 100)}%</div>
        <div class="prob">😢 <div style="width:${Math.round(prob[1] * 70)}%"></div> ${Math.round(prob[1] * 100)}%</div>
        <p>Me fijé en: ${claves.map(([w, g]) => `<strong>${esc(w)}</strong> ${g ? '😢' : '😀'}`).join(', ')}</p>
        <p class="suave">Si se equivocó, enseñale más ejemplos con esas palabras y probá de nuevo.</p>`;
      alLograr(true);
    };
  } else if (id === 'palabras') {
    cont.innerHTML = (`<div class="grande">✍️</div>
      <p class="texto">La máquina lee un texto y aprende qué palabra suele venir después de cada palabra.</p>
      <textarea id="texto" rows="5" aria-label="Texto para aprender">${CUENTO}</textarea>
      <p class="suave">Podés borrar el cuento y pegar un texto tuyo: un resumen de clase, una canción, una poesía.</p>
      <input type="text" id="inicio" value="el" aria-label="Palabra para empezar">
      <div class="fila"><button class="opcion" id="sigue">🔮 ¿Qué sigue?</button><button class="opcion" id="sola">✍️ Que escriba sola</button></div>
      <div id="resultado" class="aviso" aria-live="polite"></div>`);
    const res = cont.querySelector('#resultado');
    const datos = () => [aprenderTexto(cont.querySelector('#texto').value), palabrasDe(cont.querySelector('#inicio').value, 1)[0] || ''];
    cont.querySelector('#sigue').onclick = () => {
      const [sig, w] = datos(), ops = siguientes(sig, w).slice(0, 4), tot = ops.reduce((s, [, c]) => s + c, 0);
      res.className = 'aviso';
      res.innerHTML = ops.length ? `Después de "<strong>${esc(w)}</strong>" vi:` + ops.map(([x, c]) => `<div class="prob">${esc(x)} <div style="width:${Math.round(c / tot * 60)}%"></div> ${c} ${c === 1 ? 'vez' : 'veces'}</div>`).join('')
        : `🤷 "${esc(w)}" no aparece en el texto (o es la última palabra). ¡Probá otra!`;
    };
    cont.querySelector('#sola').onclick = () => {
      const [sig, w] = datos();
      res.className = 'aviso';
      res.innerHTML = siguientes(sig, w).length ? `📝 ${esc(escribirSola(sig, w))}...<p class="suave">Tocá de nuevo: cada vez sale distinto. Un chatbot hace esto mismo, pero aprendió de millones de textos.</p>`
        : `🤷 "${esc(w)}" no aparece en el texto. ¡Probá otra palabra!`;
      alLograr(true);
    };
  } else if (id === 'tapar') {
    let faltan = MENSAJE.filter(([, x]) => x === 1).length;
    cont.innerHTML = (`<div class="grande">🕵️</div>
      <p class="texto">Alguien va a mandarle esto a una IA. Tocá los datos personales para taparlos.</p>
      <p class="chip" style="display:block;line-height:2.2">${MENSAJE.map(([t, x], k) => x ? `<button class="opcion" style="display:inline;padding:.1rem .4rem" data-k="${k}">${t}</button>` : t).join('')}</p>
      <div id="resultado" class="aviso" aria-live="polite"></div>`);
    const res = cont.querySelector('#resultado');
    cont.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
      if (MENSAJE[b.dataset.k][1] === 2) { b.classList.add('mal'); res.className = 'aviso mal'; res.textContent = '🙂 Eso no es un dato personal: ¡se puede preguntar tranquilo!'; return; }
      b.textContent = '████'; b.disabled = true; b.classList.add('bien');
      res.className = 'aviso bien';
      res.textContent = --faltan ? '✅ ¡Bien! Quedan ' + faltan + ' datos.' : '🎉 ¡Listo! Ahora el mensaje es seguro y la IA igual puede ayudar con la tarea.';
      if (!faltan) alLograr(true);
    });
  } else {
    let nivel = 0, prog = [];
    const pintar = (pos = null) => {
      const mapa = NIVELES[nivel];
      const [rr, rc] = pos || [mapa.findIndex(f => f.includes('R')), mapa[mapa.findIndex(f => f.includes('R'))].indexOf('R')];
      cont.querySelector('.grilla').innerHTML = mapa.flatMap((f, r) => [...f].map((x, c) => `<div class="celda">${r === rr && c === rc ? '🤖' : x === '#' ? '🧱' : x === 'E' ? '⭐' : ''}</div>`)).join('');
      cont.querySelector('.programa').textContent = prog.join('') || 'Tu programa aparece acá';
    };
    const armar = () => {
      cont.innerHTML = (`<p class="texto">Nivel ${nivel + 1} de ${NIVELES.length}: llevá al robot hasta la ⭐ sin chocar 🧱</p>
        <div class="grilla"></div>
        <div class="fila">${Object.keys(DIR).map(d => `<button class="opcion" data-d="${d}" aria-label="Agregar paso">${d}</button>`).join('')}</div>
        <p class="programa"></p>
        <div class="fila"><button class="opcion" id="borrar">🗑️ Borrar</button><button class="boton" id="correr">▶️ Ejecutar</button></div>
        <div id="resultado" class="aviso" aria-live="polite"></div>`);
      const res = cont.querySelector('#resultado');
      cont.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { prog.push(b.dataset.d); pintar(); });
      cont.querySelector('#borrar').onclick = () => { prog = []; res.textContent = ''; pintar(); };
      cont.querySelector('#correr').onclick = () => {
        clearInterval(corriendo);
        const { camino, fin } = correrRobot(NIVELES[nivel], prog);
        let k = 0;
        corriendo = setInterval(() => {
          pintar(camino[k++]);
          if (k < camino.length) return;
          clearInterval(corriendo);
          if (fin === 'estrella') {
            res.className = 'aviso bien';
            res.innerHTML = `🎉 ¡Llegaste en ${camino.length - 1} pasos! ` + (nivel + 1 < NIVELES.length ? '<button class="boton" id="otro">Siguiente nivel →</button>' : '🏆 ¡Sos programador!');
            alLograr(nivel + 1 === NIVELES.length);
            cont.querySelector('#otro')?.addEventListener('click', () => { nivel++; prog = []; armar(); });
          } else {
            res.className = 'aviso mal';
            res.textContent = fin === 'choque' ? `💥 ¡Choque en el paso ${camino.length}! Borrá y probá otro camino.` : '🤔 El robot se quedó sin pasos antes de llegar. ¡Agregá más!';
          }
        }, 350);
      };
      pintar();
    };
    armar();
  }
}

function taller(id) {
  const t = TALLER.find(x => x.id === id);
  if (!t) return inicio();
  document.documentElement.style.setProperty('--color', t.color);
  app.innerHTML = '<a class="volver" href="#/">← Inicio</a><section class="tarjeta"></section>';
  montarTaller(id, app.querySelector('.tarjeta'), ultimo => { if (ultimo) logro(id); });
  scrollTo(0, 0);
}

function rutear() {
  window.speechSynthesis?.cancel();
  clearInterval(corriendo);
  if (location.hash.startsWith('#/taller/')) return taller(location.hash.slice(9));
  const i = Number(location.hash.slice(2));
  if (location.hash.length > 2 && MISIONES[i]) mision(i); else inicio();
}
addEventListener('hashchange', rutear);
rutear();
</script>

name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # El curso de Data Engineering corre de verdad los códigos Python de sus lecciones (test-de)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # La misma versión de pandas que el laboratorio del navegador (Pyodide 0.29.3) y la que dan las salidas de las lecciones
      - run: pip install pandas==2.3.2
      - run: node tools/validar.js && node tools/test-app.js && node tools/test-chicos.js && node tools/test-ingles.js && node tools/validar.js datos && node tools/test-datos.js && node tools/test-mapas.js && node tools/validar.js data-engineering && PYTHON=python node tools/test-de.js
      # Cada curso nuevo (una carpeta de public/ con contenido.js) se valida solo, sin tener que agregarlo acá
      - run: |
          for d in public/*/; do
            if [ -f "$d/contenido.js" ]; then node tools/validar.js "$(basename "$d")" > /dev/null || { echo "falla en $d"; node tools/validar.js "$(basename "$d")"; exit 1; }; fi
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
